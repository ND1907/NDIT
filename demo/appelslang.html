<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appelslang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Rubik:wght@400;600;700&display=swap">
<style>
  /* Layout: one centered column — title row, score strip, the lawn (canvas), then controls. Single daytime-garden look on purpose. */
  :root {
    --bg: #dfeccd;         /* pale meadow */
    --ink: #22361b;        /* deep leaf */
    --muted: #5a6e4c;
    --lawn-a: #a9d46f;
    --lawn-b: #9fcb64;
    --hedge: #4f7d2c;      /* board frame */
    --snake: #3a6fd8;
    --snake-dark: #2852a8;
    --apple: #e3342f;
    --chip: #f6faef;
    --font-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 8vw, 2.8rem);
    line-height: 1;
    margin: 0;
    color: var(--hedge);
    letter-spacing: 0.01em;
  }
  h1 span { color: var(--apple); }
  .scores { display: flex; gap: 8px; }
  .chip {
    background: var(--chip);
    border: 2px solid var(--hedge);
    border-radius: 999px;
    padding: 4px 12px;
    display: flex; align-items: baseline; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .chip small { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  .chip b { font-size: 1.15rem; }

  .board {
    position: relative;
    border: 8px solid var(--hedge);
    border-radius: 14px;
    background: var(--hedge);
    box-shadow: 0 6px 0 #3b5f20;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center;
    padding: 16px;
    background: rgba(34, 54, 27, 0.55);
    color: #fff;
    border-radius: 6px;
  }
  .overlay h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 7vw, 2.4rem); margin: 0; text-wrap: balance; }
  .overlay p { margin: 0; max-width: 30ch; line-height: 1.45; }
  button {
    font: inherit;
    cursor: pointer;
  }
  .play {
    margin-top: 4px;
    background: var(--apple);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 10px 26px;
    font-weight: 700;
    font-size: 1.05rem;
    box-shadow: 0 4px 0 #9e1f1b;
  }
  .play:active { transform: translateY(3px); box-shadow: 0 1px 0 #9e1f1b; }
  button:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }

  .pad {
    display: none;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
    justify-content: center;
  }
  .pad button {
    background: var(--chip);
    border: 2px solid var(--hedge);
    border-radius: 14px;
    color: var(--hedge);
    font-size: 1.4rem;
    box-shadow: 0 4px 0 var(--hedge);
    touch-action: manipulation;
  }
  .pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--hedge); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .pad { display: grid; } }

  .help { margin: 0; color: var(--muted); line-height: 1.5; text-align: center; }
  kbd {
    font-family: var(--font-body);
    font-size: 0.8rem;
    background: var(--chip);
    border: 1px solid var(--muted);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Appel<span>slang</span></h1>
    <div class="scores">
      <div class="chip"><small>Appels</small><b id="score">0</b></div>
      <div class="chip"><small>Record</small><b id="best">0</b></div>
    </div>
  </header>

  <div class="board" id="board">
    <canvas id="game" width="510" height="450" aria-label="Speelveld van Appelslang"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Eet de appels!</h2>
      <p id="ov-text">Stuur de slang naar de rode appel. Elke appel maakt je langer en sneller. Raak geen muur en niet je eigen staart.</p>
      <button class="play" id="play" type="button">Start</button>
    </div>
  </div>

  <div class="pad" aria-label="Richtingknoppen">
    <button class="up" type="button" data-dir="up" aria-label="Omhoog">▲</button>
    <button class="left" type="button" data-dir="left" aria-label="Links">◀</button>
    <button class="down" type="button" data-dir="down" aria-label="Omlaag">▼</button>
    <button class="right" type="button" data-dir="right" aria-label="Rechts">▶</button>
  </div>

  <p class="help">Pijltjestoetsen of <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> om te sturen, <kbd>spatie</kbd> voor pauze. Op je telefoon: veeg over het veld of gebruik de knoppen.</p>
</div>

<script>
(() => {
  const COLS = 17, ROWS = 15;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPP = { up: "down", down: "up", left: "right", right: "left" };

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ov-title");
  const ovText = document.getElementById("ov-text");
  const playBtn = document.getElementById("play");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const board = document.getElementById("board");
  const css = getComputedStyle(document.documentElement);
  const C = name => css.getPropertyValue(name).trim();

  let cell = 30;
  let snake, prev, dir, queue, apple, score, state, step, acc, last, eatPop;
  let best = 0;
  try { best = parseInt(localStorage.getItem("appelslang-record") || "0", 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function resize() {
    const w = canvas.parentElement.clientWidth - 16;
    const dpr = window.devicePixelRatio || 1;
    cell = Math.max(12, Math.floor(w / COLS));
    canvas.width = cell * COLS * dpr;
    canvas.height = cell * ROWS * dpr;
    canvas.style.width = cell * COLS + "px";
    canvas.style.height = cell * ROWS + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(1);
  }

  function reset() {
    const y = Math.floor(ROWS / 2);
    snake = [{ x: 5, y }, { x: 4, y }, { x: 3, y }];
    prev = snake.map(p => ({ ...p }));
    dir = "right";
    queue = [];
    score = 0;
    step = 150;
    acc = 0;
    eatPop = 0;
    scoreEl.textContent = 0;
    placeApple();
  }

  function placeApple() {
    const free = [];
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    apple = free[Math.floor(Math.random() * free.length)];
  }

  function turn(d) {
    if (state === "ready" || state === "over") { start(); }
    if (state === "paused") { resume(); }
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (d === lastDir || d === OPP[lastDir]) return;
    if (queue.length < 3) queue.push(d);
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    const eating = apple && head.x === apple.x && head.y === apple.y;
    const body = eating ? snake : snake.slice(0, -1);
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS || body.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    prev = snake.map(p => ({ ...p }));
    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      step = Math.max(65, step - 4);
      eatPop = 1;
      chomp();
      if (snake.length === COLS * ROWS) return gameOver(true);
      placeApple();
    } else {
      snake.pop();
    }
  }

  function loop(now) {
    const dt = Math.min(100, now - last);
    last = now;
    if (state === "play") {
      acc += dt;
      while (acc >= step && state === "play") { acc -= step; tick(); }
    }
    eatPop = Math.max(0, eatPop - dt / 250);
    draw(state === "play" ? acc / step : 1);
    requestAnimationFrame(loop);
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function draw(t) {
    const W = cell * COLS, H = cell * ROWS;
    // lawn
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++) {
        ctx.fillStyle = (x + y) % 2 ? C("--lawn-b") : C("--lawn-a");
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    if (!snake) return;

    // apple
    if (apple) drawApple(apple.x * cell + cell / 2, apple.y * cell + cell / 2);

    // snake: smooth tube through interpolated segment centers
    const pts = snake.map((s, i) => {
      const p = prev[Math.min(i, prev.length - 1)];
      const tt = state === "over" ? 1 : t;
      return { x: (lerp(p.x, s.x, tt) + 0.5) * cell, y: (lerp(p.y, s.y, tt) + 0.5) * cell };
    });
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const thick = cell * (0.72 + eatPop * 0.1);
    for (const [color, w] of [[C("--snake-dark"), thick + 3], [C("--snake"), thick]]) {
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.beginPath();
      pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      if (pts.length === 1) ctx.lineTo(pts[0].x + 0.01, pts[0].y);
      ctx.stroke();
    }

    // head + eyes
    const h = pts[0];
    const [dx, dy] = DIRS[dir];
    ctx.fillStyle = C("--snake");
    ctx.beginPath(); ctx.arc(h.x, h.y, thick * 0.6, 0, Math.PI * 2); ctx.fill();
    const px = -dy, py = dx; // perpendicular
    for (const side of [-1, 1]) {
      const ex = h.x + dx * cell * 0.12 + px * side * cell * 0.2;
      const ey = h.y + dy * cell * 0.12 + py * side * cell * 0.2;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(ex, ey, cell * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#14213d";
      if (state === "over") {
        ctx.lineWidth = 2; ctx.strokeStyle = "#14213d";
        const r = cell * 0.08;
        ctx.beginPath(); ctx.moveTo(ex - r, ey - r); ctx.lineTo(ex + r, ey + r); ctx.moveTo(ex + r, ey - r); ctx.lineTo(ex - r, ey + r); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(ex + dx * cell * 0.05, ey + dy * cell * 0.05, cell * 0.07, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawApple(cx, cy) {
    const bob = Math.sin(performance.now() / 300) * cell * 0.03;
    const r = cell * 0.36;
    cy += bob;
    // shadow
    ctx.fillStyle = "rgba(34,54,27,0.18)";
    ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.95 - bob, r * 0.8, r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    // body (two lobes)
    ctx.fillStyle = C("--apple");
    ctx.beginPath();
    ctx.arc(cx - r * 0.28, cy + r * 0.05, r * 0.78, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.28, cy + r * 0.05, r * 0.78, 0, Math.PI * 2);
    ctx.fill();
    // shine
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.ellipse(cx - r * 0.45, cy - r * 0.2, r * 0.16, r * 0.26, -0.5, 0, Math.PI * 2); ctx.fill();
    // stem
    ctx.strokeStyle = "#6b3e1f";
    ctx.lineWidth = Math.max(2, cell * 0.07);
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx, cy - r * 0.55); ctx.quadraticCurveTo(cx + r * 0.05, cy - r * 0.95, cx + r * 0.2, cy - r * 1.1); ctx.stroke();
    // leaf
    ctx.fillStyle = "#3f9a2f";
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.42, cy - r * 0.9, r * 0.32, r * 0.15, -0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- sound (starts only after the player presses something) ---
  let audio;
  function chomp() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(520, audio.currentTime);
      o.frequency.exponentialRampToValueAtTime(880, audio.currentTime + 0.08);
      g.gain.setValueAtTime(0.06, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.12);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.13);
    } catch (e) {}
  }

  // --- states ---
  function showOverlay(title, text, label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    playBtn.textContent = label;
    overlay.hidden = false;
  }

  function start() {
    reset();
    state = "play";
    overlay.hidden = true;
  }

  function pause() {
    if (state !== "play") return;
    state = "paused";
    showOverlay("Pauze", "Druk op spatie, een pijltje of de knop om verder te spelen.", "Verder");
  }

  function resume() {
    state = "play";
    overlay.hidden = true;
  }

  function gameOver(won) {
    state = "over";
    prev = snake.map(p => ({ ...p }));
    let msg = score === 1 ? "Je at 1 appel." : `Je at ${score} appels.`;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("appelslang-record", String(best)); } catch (e) {}
      if (score > 0) msg += " Nieuw record!";
    }
    showOverlay(won ? "Je hebt gewonnen!" : "Au, botsing!", msg, "Opnieuw");
    playBtn.focus({ preventScroll: true });
  }

  playBtn.addEventListener("click", () => (state === "paused" ? resume() : start()));

  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  };
  window.addEventListener("keydown", e => {
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
    else if (e.key === " " || e.key === "p" || e.key === "P") {
      e.preventDefault();
      if (state === "play") pause();
      else if (state === "paused") resume();
      else start();
    }
  });

  document.querySelectorAll(".pad button").forEach(b =>
    b.addEventListener("pointerdown", e => { e.preventDefault(); turn(b.dataset.dir); })
  );

  // swipe on the board
  let sx = null, sy = null;
  board.addEventListener("touchstart", e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
  }, { passive: true });
  board.addEventListener("touchmove", e => {
    if (sx === null) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    if (e.target.closest(".play")) return;
    e.preventDefault();
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    sx = t.clientX; sy = t.clientY;
  }, { passive: false });
  board.addEventListener("touchend", () => { sx = sy = null; });

  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  window.addEventListener("resize", resize);

  reset();
  state = "ready";
  resize();
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
